<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoyageAI | Administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="admin-body">
<nav class="navbar navbar-dark sticky-top admin-nav"><div class="container"><a class="navbar-brand" href="/"><span class="brand-mark">✦</span> VoyageAI <span class="admin-label">ADMINISTRATION</span></a><div class="d-flex gap-2 align-items-center"><span id="adminIdentity" class="admin-identity">Checking access…</span><button id="logoutBtn" class="btn btn-sm btn-outline-light">Sign out</button></div></div></nav>

<section class="col-lg-5"><div class="admin-panel mb-4"><div class="panel-heading"><div><p class="eyebrow accent">PLATFORM</p><h2>System status</h2></div></div><div id="systemStatus"></div></div><div class="admin-panel"><div class="panel-heading"><div><p class="eyebrow accent">ACCESS</p><h2>User management</h2></div></div><div id="usersTable" class="table-responsive"></div></div></section>
